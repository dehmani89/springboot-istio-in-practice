# Single Postgres instance hosting one database per service.
# Bootstrap SQL comes from ConfigMap "postgres-init", created by scripts/deploy.sh
# from infra/postgres/init/ (single source of truth shared with docker-compose).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: dental-data
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres-admin-pw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: dental-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dental-data
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: tcp-postgres      # "tcp-" prefix tells Istio this is opaque TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dental-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: tcp-postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
