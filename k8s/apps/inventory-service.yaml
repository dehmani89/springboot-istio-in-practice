apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service            # becomes the SPIFFE identity: cluster.local/ns/dental/sa/inventory-service
  namespace: dental
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-db
  namespace: dental
type: Opaque
stringData:
  DB_USER: inventory_svc
  DB_PASSWORD: inventory_svc_pw
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: dental
  labels:
    app: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - name: http              # "http" name = explicit protocol selection for Istio
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: dental
  labels:
    app: inventory-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
      version: v1
  template:
    metadata:
      labels:
        app: inventory-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: inventory-service
      containers:
        - name: inventory-service
          image: dental-oms/inventory-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: DB_HOST
              value: postgres.dental-data.svc.cluster.local
            - name: DB_NAME
              value: inventory_db
          envFrom:
            - secretRef:
                name: inventory-service-db
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
