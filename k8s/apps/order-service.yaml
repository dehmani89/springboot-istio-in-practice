apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service            # becomes the SPIFFE identity: cluster.local/ns/dental/sa/order-service
  namespace: dental
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-db
  namespace: dental
type: Opaque
stringData:
  DB_USER: order_svc
  DB_PASSWORD: order_svc_pw
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: dental
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http              # "http" name = explicit protocol selection for Istio
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: dental
  labels:
    app: order-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      version: v1
  template:
    metadata:
      labels:
        app: order-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: order-service
      containers:
        - name: order-service
          image: dental-oms/order-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres.dental-data.svc.cluster.local
            - name: DB_NAME
              value: order_db
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service
            - name: PRICING_SERVICE_URL
              value: http://pricing-service
          envFrom:
            - secretRef:
                name: order-service-db
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
