# Header-based routing: "x-pricing-version: v2" goes to v2, everything else to v1.
# Works end-to-end only because order-service forwards x-pricing-version (HeaderPropagationInterceptor).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pricing-service
  namespace: dental
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: pricing-service
      port: 80
  rules:
    - matches:
        - headers:
            - name: x-pricing-version
              value: v2
      backendRefs:
        - name: pricing-service-v2
          port: 80
    - backendRefs:
        - name: pricing-service-v1
          port: 80
