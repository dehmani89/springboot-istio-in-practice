server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD:order_svc_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c,b3

oms:
  downstream:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    pricing-url: ${PRICING_SERVICE_URL:http://localhost:8083}
    connect-timeout: 2s
    read-timeout: 5s
    propagate-headers:
      - x-request-id
      - x-pricing-version
      - x-customer-tier
