server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: pricing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pricing_db}
    username: ${DB_USER:pricing_svc}
    password: ${DB_PASSWORD:pricing_svc_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c,b3

pricing:
  engine-version: ${PRICING_ENGINE_VERSION:v1}

chaos:
  latency-ms: ${CHAOS_LATENCY_MS:0}
  failure-rate: ${CHAOS_FAILURE_RATE:0.0}
